name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so a vpay merge that outruns this repository turns up here as a red
    # build rather than as a confidently wrong agent three weeks later.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  coverage:
    name: docs↔skills parity
    runs-on: ubuntu-latest
    steps:
      - name: Check out vpay-skills
        uses: actions/checkout@v4
        with:
          path: vpay-skills

      - name: Check out vpay
        uses: actions/checkout@v4
        with:
          repository: vaam-apps/vpay
          path: vpay
          # FULL history, not a shallow clone. This said `fetch-depth: 1` with
          # "the gate reads docs/ and tests that claimed paths exist, so a
          # shallow clone is enough" until 2026-09-16, and that stopped being
          # true when the gate learned to ask WHEN a page was added. With
          # depth 1 the baseline commit is absent from the clone the moment
          # vpay's master moves one commit past it, so every covered page
          # looks "added AFTER the baseline" and the gate fails with 21 gaps
          # that are not gaps. Measured after vaam-apps/vpay#182 merged.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: verify-coverage
        working-directory: vpay-skills
        run: node tools/verify-coverage.mjs "$GITHUB_WORKSPACE/vpay"

  format:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes prettier@3 --check "**/*.{md,json,yml}"
